<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Study of Photography Experiences</title>
  <style>
    :root {
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #d2d2d7;
      --soft-line: #e8e8ed;
      --footer: #f5f5f7;
      --bg: #ffffff;
      --accent-blue: #1d1d1f;
      --danger-red: #ff3b30;
      --site-max-width: 1120px;
      --gallery-control-bg: rgba(0, 0, 0, .58);
      --gallery-control-text: #ffffff;
      --gallery-control-height: 38px;
      --gallery-control-blur: 12px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button { font: inherit; }

    .page {
      min-height: 100vh;
      background: #fff;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: #111;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: url("https://images.pexels.com/photos/11973344/pexels-photo-11973344.jpeg") center center / cover no-repeat;
      transform: scale(1);
      animation: heroSlowZoom 12s cubic-bezier(.16, 1, .3, 1) forwards;
      will-change: transform;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.20) 42%, rgba(0,0,0,.62) 100%);
      pointer-events: none;
    }

    @keyframes heroSlowZoom {
      from { transform: scale(1); }
      to { transform: scale(1.105); }
    }

    .hero-inner {
      width: 100%;
      max-width: var(--site-max-width);
      margin: 0 auto;
      padding: 48px 48px 68px;
      position: relative;
      z-index: 2;
    }

    .hero-lockup {
      max-width: 980px;
    }

    .hero-eyebrow {
      margin: 0 0 18px;
      color: #fff;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1;
      letter-spacing: -.03em;
      font-weight: 700;
    }

    .hero-title {
      margin: 0;
      color: #fff;
      max-width: 1040px;
      font-size: clamp(56px, 8vw, 116px);
      line-height: .96;
      letter-spacing: -.035em;
      font-weight: 800;
      text-wrap: balance;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 30px 0 0;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 58px;
      padding: 12px 28px 12px 22px;
      border-radius: 999px;
      font-size: 15px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.01em;
      text-decoration: none;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
      border: 0;
    }

    .button-play-icon {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 1.8px solid currentColor;
      background: transparent;
      color: currentColor;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .button-play-icon::before {
      content: "";
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid currentColor;
      margin-left: 2px;
    }

    .action-button:hover {
      transform: translateY(-1px);
    }

    .action-button.primary {
      background: rgba(255, 255, 255, .92);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, .42);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .14);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
    }

    .action-button.primary .button-play-icon {
      background: transparent;
      color: var(--text);
    }

    .content-wrap {
      width: 100%;
      max-width: var(--site-max-width);
      margin: 0 auto;
      padding: 56px 48px 0;
    }

    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 32px;
      background: rgba(0, 0, 0, .68);
      backdrop-filter: blur(24px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease;
    }

    .video-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .video-modal-shell {
      width: min(100%, 1060px, calc((100dvh - 294px) * 16 / 9));
      max-height: calc(100dvh - 64px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 18px;
      background: #1c1c1e;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .42);
      transform: translateY(14px) scale(.985);
      transition: transform .24s ease;
    }

    .video-modal.open .video-modal-shell {
      transform: translateY(0) scale(1);
    }

    .video-modal-card {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      flex: 0 0 auto;
      overflow: hidden;
      background: #111;
    }

    .video-modal-card video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #111;
    }

    .video-transcript-header {
      flex: 0 0 auto;
      background: #1c1c1e;
      border-top: 1px solid rgba(255, 255, 255, .08);
    }

    .video-transcript-toggle {
      width: 100%;
      min-height: 56px;
      padding: 0 56px;
      border: 0;
      background: transparent;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      cursor: pointer;
      text-align: left;
    }

    .video-transcript-toggle:hover {
      background: rgba(255, 255, 255, .035);
    }

    .video-transcript-toggle:focus-visible {
      outline: 2px solid rgba(255, 255, 255, .72);
      outline-offset: -4px;
    }

    .video-transcript-label {
      display: block;
      max-width: 900px;
      color: #ffffff;
      font-size: 13px;
      line-height: 1;
      letter-spacing: -.006em;
      font-weight: 800;
      text-transform: none;
    }

    .video-transcript-chevron {
      width: 22px;
      height: 22px;
      display: block;
      flex: 0 0 auto;
      color: #8e8e93;
      transition: transform .3s cubic-bezier(.2, 0, .2, 1), color .2s ease;
    }

    .video-transcript-chevron path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .video-transcript-toggle[aria-expanded="true"] .video-transcript-chevron {
      transform: rotate(180deg);
    }

    .video-transcript-toggle:hover .video-transcript-chevron {
      color: #ffffff;
    }

    .video-transcript-panel {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      background: #1c1c1e;
      transition: max-height .38s cubic-bezier(.2, 0, .2, 1), opacity .22s ease;
    }

    .video-transcript-panel.is-open {
      max-height: 260px;
      opacity: 1;
    }

    .video-transcript {
      position: relative;
      height: 260px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px 56px 46px;
      background: #1c1c1e;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.22) transparent;
      scroll-behavior: smooth;
    }

    .video-transcript::-webkit-scrollbar {
      width: 8px;
    }

    .video-transcript::-webkit-scrollbar-track {
      background: transparent;
    }

    .video-transcript::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.2);
      border-radius: 999px;
    }

    .video-transcript-text {
      max-width: 900px;
      margin: 0 auto;
      color: #c7c7cc;
      font-size: clamp(20px, 2.1vw, 30px);
      line-height: 1.5;
      letter-spacing: -.02em;
      font-weight: 600;
    }

    .transcript-cue {
      width: 100%;
      margin: 0 0 1.15em;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #8e8e93;
      opacity: .82;
      font: inherit;
      line-height: inherit;
      letter-spacing: inherit;
      font-weight: inherit;
      text-align: left;
      cursor: pointer;
      transition: color .2s ease, opacity .2s ease, background .2s ease;
    }

    .transcript-cue:hover {
      color: #d1d1d6;
      opacity: 1;
    }

    .transcript-cue:focus-visible {
      outline: 2px solid rgba(255, 255, 255, .72);
      outline-offset: 5px;
    }

    .transcript-cue.is-active {
      color: #ffffff;
      opacity: 1;
    }

    .transcript-cue:last-child {
      margin-bottom: 0;
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .86);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 1001;
      backdrop-filter: blur(16px);
      transition: transform .18s ease, background .18s ease;
    }

    .modal-close:hover {
      transform: scale(1.04);
      background: #fff;
    }

    .modal-close::before,
    .modal-close::after {
      content: "";
      position: absolute;
      width: 17px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }

    .modal-close::before { transform: rotate(45deg); }
    .modal-close::after { transform: rotate(-45deg); }

    body.modal-open,
    body.gallery-lightbox-open {
      overflow: hidden;
    }

    .reveal-on-load,
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(34px);
      transition: opacity .9s cubic-bezier(.16, 1, .3, 1), transform .9s cubic-bezier(.16, 1, .3, 1);
      will-change: opacity, transform;
    }

    .reveal-on-load.is-visible,
    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-delay-1 { transition-delay: .08s; }
    .reveal-delay-2 { transition-delay: .18s; }
    .reveal-delay-3 { transition-delay: .28s; }

    @media (prefers-reduced-motion: reduce) {
      .hero::before,
      .reveal-on-load,
      .reveal-on-scroll,
      .accordion-panel,
      .video-modal,
      .video-modal-shell,
      .video-modal-card {
        transition: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
    }

    .faq-section {
      margin-top: 0;
    }

    .faq-title {
      margin: 0 0 18px;
      font-size: clamp(40px, 4.8vw, 58px);
      line-height: 1.02;
      letter-spacing: -.04em;
      font-weight: 800;
    }

    .intro-line {
      margin: 0 0 28px;
      max-width: 760px;
      color: var(--muted);
      font-size: 21px;
      line-height: 1.32;
      letter-spacing: -.018em;
      font-weight: 600;
    }

    .faq-search-wrap {
      margin: 0 0 38px;
      max-width: 760px;
    }

    .faq-search {
      min-height: 56px;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--soft-line);
      border-radius: 18px;
      padding: 0 14px 0 18px;
      background: #f5f5f7;
      color: var(--muted);
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .faq-search:focus-within {
      background: #fff;
      border-color: rgba(29, 29, 31, .34);
      box-shadow: 0 0 0 4px rgba(0, 0, 0, .07);
    }

    .faq-search-icon {
      width: 24px;
      height: 24px;
      display: block;
      color: #86868b;
    }

    .faq-search-icon path,
    .faq-search-icon circle {
      stroke: currentColor;
      fill: none;
      stroke-width: 2.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .faq-search-input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 19px;
      line-height: 1;
      letter-spacing: -.018em;
      font-weight: 700;
      padding: 14px 0;
      min-width: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .faq-search-input::-webkit-search-cancel-button,
    .faq-search-input::-webkit-search-decoration,
    .faq-search-input::-webkit-search-results-button,
    .faq-search-input::-webkit-search-results-decoration {
      appearance: none;
      -webkit-appearance: none;
      display: none;
    }

    .faq-search-input::placeholder {
      color: #86868b;
      opacity: 1;
    }

    .faq-search-clear {
      border: 0;
      background: transparent;
      color: var(--danger-red);
      border-radius: 999px;
      width: 30px;
      height: 30px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 0;
      line-height: 1;
      font-weight: 800;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, background .2s ease, color .2s ease;
      position: relative;
    }

    .faq-search-clear::before,
    .faq-search-clear::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }

    .faq-search-clear::before { transform: rotate(45deg); }
    .faq-search-clear::after { transform: rotate(-45deg); }

    .faq-search-clear.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .faq-search-clear:hover {
      color: #d70015;
      background: rgba(255, 59, 48, .1);
    }

    .faq-search-meta {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
      letter-spacing: -.006em;
      font-weight: 700;
      min-height: 17px;
    }

    .search-highlight {
      background: rgba(0, 0, 0, .10);
      color: inherit;
      border-radius: 5px;
      padding: 0 .1em;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      transition: background .28s ease, box-shadow .28s ease;
    }

    .search-highlight.first-match {
      background: rgba(0, 0, 0, .16);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, .12);
    }

    .faq-category {
      margin: 54px 0 18px;
      color: var(--text);
      font-size: clamp(24px, 2.4vw, 32px);
      line-height: 1.08;
      letter-spacing: -.035em;
      text-transform: none;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .faq-category-icon {
      width: 58px;
      height: 58px;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .faq-category-icon svg {
      width: 38px;
      height: 38px;
      display: block;
    }

    .faq-category-icon path,
    .faq-category-icon circle,
    .faq-category-icon rect,
    .faq-category-icon line,
    .faq-category-icon polyline {
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .accordion {
      background: #fff;
      border-top: 1px solid var(--soft-line);
    }

    .accordion-item {
      border-bottom: 1px solid var(--soft-line);
      background: #fff;
    }

    .accordion-trigger {
      width: 100%;
      min-height: 56px;
      border: 0;
      background: #fff;
      display: grid;
      grid-template-columns: 1fr 28px;
      align-items: center;
      gap: 24px;
      padding: 0;
      text-align: left;
      color: var(--text);
      cursor: pointer;
    }

    .accordion-title {
      font-size: 21px;
      line-height: 1.18;
      letter-spacing: -.04em;
      font-weight: 800;
      padding: 17px 0;
    }

    .accordion-icon {
      width: 28px;
      height: 28px;
      position: relative;
      justify-self: end;
    }

    .accordion-icon::before,
    .accordion-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 10px;
      height: 2px;
      background: #8b8b91;
      border-radius: 999px;
      transition: transform .32s cubic-bezier(.2, 0, .2, 1), background .2s ease;
    }

    .accordion-icon::before {
      left: 6px;
      transform: translateY(-50%) rotate(45deg);
    }

    .accordion-icon::after {
      right: 6px;
      transform: translateY(-50%) rotate(-45deg);
    }

    .accordion-item.open .accordion-icon::before {
      transform: translateY(-50%) rotate(-45deg);
    }

    .accordion-item.open .accordion-icon::after {
      transform: translateY(-50%) rotate(45deg);
    }

    .accordion-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-6px);
      transition: max-height .42s cubic-bezier(.2, 0, .2, 1), opacity .26s ease, transform .32s cubic-bezier(.2, 0, .2, 1);
      background: #fff;
    }

    .accordion-item.open .accordion-panel {
      opacity: 1;
      transform: translateY(0);
    }

    .accordion-panel-inner {
      padding: 0 0 31px;
      background: #fff;
    }

    .accordion-panel p {
      margin: 0;
      max-width: 760px;
      color: #3a3a3c;
      font-size: 17px;
      line-height: 1.45;
      letter-spacing: -.006em;
    }

    .gallery-section {
      margin-top: 88px;
      width: 100vw;
      margin-left: calc(50% - 50vw);
      background: #f5f5f7;
      padding: 72px 0 84px;
      overflow: hidden;
    }

    .gallery-inner {
      width: 100%;
      max-width: var(--site-max-width);
      margin: 0 auto;
      padding: 0 48px;
    }

    .gallery-intro {
      max-width: 820px;
      margin: 0 0 42px;
    }

    .gallery-intro h2 {
      margin: 0 0 12px;
      color: var(--text);
      font-size: clamp(34px, 4.2vw, 56px);
      line-height: 1.03;
      letter-spacing: -.05em;
      font-weight: 800;
    }

    .gallery-intro p {
      margin: 0;
      color: var(--muted);
      font-size: 21px;
      line-height: 1.32;
      letter-spacing: -.018em;
      font-weight: 600;
      max-width: 790px;
    }


    .gallery-carousel {
      width: 100%;
    }

    .gallery-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 24px;
      background: #111;
      box-shadow: none;
    }

    .gallery-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity .34s ease, visibility .34s ease;
    }

    .gallery-slide.is-active {
      opacity: 1;
      visibility: visible;
    }

    .gallery-media {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #111;
    }

    .gallery-open-area {
      position: absolute;
      inset: 0;
      z-index: 2;
      border: 0;
      background: transparent;
      cursor: zoom-in;
    }

    .gallery-expand {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 4;
      width: var(--gallery-control-height);
      min-height: var(--gallery-control-height);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 999px;
      background: var(--gallery-control-bg);
      color: var(--gallery-control-text);
      font-size: 13px;
      line-height: 1;
      letter-spacing: -.01em;
      font-weight: 800;
      pointer-events: none;
      backdrop-filter: blur(var(--gallery-control-blur));
      -webkit-backdrop-filter: blur(var(--gallery-control-blur));
    }

    .gallery-expand-icon {
      width: 15px;
      height: 15px;
      position: relative;
      display: block;
    }

    .gallery-expand-icon::before,
    .gallery-expand-icon::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-color: currentColor;
      border-style: solid;
    }

    .gallery-expand-icon::before {
      top: 0;
      right: 0;
      border-width: 2px 2px 0 0;
    }

    .gallery-expand-icon::after {
      left: 0;
      bottom: 0;
      border-width: 0 0 2px 2px;
    }

    .gallery-counter {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 4;
      min-height: var(--gallery-control-height);
      display: inline-flex;
      align-items: center;
      padding: 0 15px;
      border-radius: 999px;
      background: var(--gallery-control-bg);
      color: var(--gallery-control-text);
      font-size: 13px;
      line-height: 1;
      letter-spacing: -.01em;
      font-weight: 800;
      pointer-events: none;
      backdrop-filter: blur(var(--gallery-control-blur));
      -webkit-backdrop-filter: blur(var(--gallery-control-blur));
    }

    .gallery-thumbnails {
      width: min(100%, 560px);
      margin: 18px auto 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .gallery-thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      padding: 0;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 12px;
      background: #e5e5ea;
      opacity: .66;
      cursor: pointer;
      transition: opacity .2s ease, border-color .2s ease, transform .2s ease;
    }

    .gallery-thumbnail:hover {
      opacity: 1;

    .gallery-thumbnail.is-active {
      opacity: 1;
      border-color: var(--text);
    }

    .gallery-thumbnail-media {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;

    .gallery-thumbnail-video-badge {
      position: absolute;

      backdrop-filter: blur(var(--gallery-control-blur));
      -webkit-backdrop-filter: blur(var(--gallery-control-blur));

    .gallery-thumbnail-play-icon::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;

      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;

    .gallery-lightbox {

      place-items: center;
      padding: 70px 82px;

      pointer-events: none;
      transition: opacity .24s ease, visibility .24s ease;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .gallery-lightbox.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .gallery-lightbox-media {
      width: min(100%, 1400px);
      height: min(82vh, 900px);
      display: grid;
      place-items: center;
    }

    .gallery-lightbox-media video,
    .gallery-lightbox-media img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: transparent;
    }

    .gallery-lightbox-close,
    .gallery-lightbox-nav {
      position: absolute;
      z-index: 2;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .9);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .gallery-lightbox-close {
      top: 22px;
      right: 22px;
    }

    .gallery-lightbox-close::before,
    .gallery-lightbox-close::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }

    .gallery-lightbox-close::before { transform: rotate(45deg); }
    .gallery-lightbox-close::after { transform: rotate(-45deg); }

    .gallery-lightbox-nav {
      top: 50%;
      transform: translateY(-50%);
    }

    .gallery-lightbox-prev { left: 22px; }
    .gallery-lightbox-next { right: 22px; }

    .gallery-lightbox-nav::before {
      content: "";
      width: 11px;
      height: 11px;
      border-top: 2px solid currentColor;
      border-right: 2px solid currentColor;
    }

    .gallery-lightbox-prev::before {
      transform: rotate(-135deg);
      margin-left: 4px;
    }

    .gallery-lightbox-next::before {
      transform: rotate(45deg);
      margin-right: 4px;
    }

    .gallery-lightbox-counter {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, .9);
      font-size: 13px;
      line-height: 1;
      letter-spacing: .02em;
      font-weight: 800;
    }

    .footer {
      background: var(--footer);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      padding: 28px 48px;
    }

    .footer-inner {
      width: 100%;
      max-width: var(--site-max-width);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      gap: 24px;

    .footer-links {

    .footer-links a {

    @media (max-width: 760px) {

      .video-transcript-panel.is-open {

  <main class="page">
    <section class="hero">

  <footer class="footer">
    <div class="footer-inner">
      <div>Copyright © 2026 Quality of Life Research Center. All rights reserved.</div>

  <script>
    const faqGroups = [
      {
            "category": "Participation & Study Overview",
            "items": [
                  {
                        "question": "What are you studying?",
                        "answer": "We are studying people's experiences with photography. The specific details of the study are not disclosed upfront to avoid introducing biases that could influence your responses."
                  },
                  {
                        "question": "Who is the research team? Who are they affiliated with?",
                        "answer": "The research team consists of graduate students and faculty from Claremont Graduate University in Claremont, California. This study is being conducted at the Quality of Life Research Center at Claremont Graduate University."
                  },
                  {
                        "question": "Can I opt out of the study?",
                        "answer": "Absolutely. Your participation is voluntary and you may opt out anytime."
                  }
            ]
      },
      {
            "category": "Study Participation & Completion",
            "items": [
                  {
                        "question": "How long will it take to fill out the surveys/reports?",
                        "answer": "Each survey is designed to take only a few minutes to complete. We recommend setting aside a small amount of time to answer the questions thoughtfully."
                  },
                  {
                        "question": "How many surveys will I receive?",
                        "answer": "Each day, you will receive one daily report at your chosen, fixed time each day. To conclude the study, you will be asked to fill out a one-time End-of-the-Study survey that will ask you to tell us more about yourself, including information such as demographics. Finally, one month after the study, you will be asked to complete a follow-up report. You will also receive reminder texts to keep track of things to do throughout the week, so please look out for text messages from us!"
                  },
                  {
                        "question": "Does leaving a survey open affect the next response?",
                        "answer": "Leaving a survey open does not interfere with upcoming signals or responses. Still, to avoid confusion, it is best to finish the current survey. If you are unable to complete the survey, please close the survey tab on your internet browser."
                  },
                  {
                        "question": "If you miss a day (e.g., daily report) where do you resume?",
                        "answer": "If you miss a day, don’t worry. We encourage you to continue from where you left off and complete as many days as possible for the study to be effective. If you miss a day, please note that we can add additional days at the end of the study. If that happens, please reach out to your contact person to schedule additional days."
                  },
                  {
                        "question": "When does the survey expire?",
                        "answer": "While all surveys will not expire until the next morning, we ask that you do try and leave yourself enough time each day to complete the photo session and the end of day reflection."
                  }
            ]
      },
      {
            "category": "Data Privacy & Security",
            "items": [
                  {
                        "question": "Will my data be anonymous?",
                        "answer": "Anonymity implies that we do not know who the data is coming from, in this study participation requires communication between you and our research team. While we cannot provide complete anonymity, your data will be kept confidential and will not be linked to your name. A randomly generated ID number will be assigned to you, and only the research team will have access to the information linking your name to that ID. All final study data will be de-identified before analysis to ensure that your responses remain confidential."
                  },
                  {
                        "question": "How will data be protected on the data collection platform’s end?",
                        "answer": "The data collection platform being used in the study uses advanced encryption and security measures. The final study data will be stored as a password-protected file."
                  },
                  {
                        "question": "Will my location be tracked through this study?",
                        "answer": "Technically, yes. Qualtrics, the survey platform, records IP addresses and location data; however, the research team does not track your data. In addition, any such data collected by Qualtrics will be removed during the data cleaning process and will not be included in the study database that will be used by the research team."
                  }
            ]
      },
      {
            "category": "Technical & Logistical Questions",
            "items": [
                  {
                        "question": "What if my phone is on vibrate/silent mode?",
                        "answer": "Even if your phone is on vibrate or silent, you will still receive texts from us as scheduled. While these signals vary depending on the start and end time you specified in your expression of interest survey, these signals are predictable, so you can check your phone at the expected times if you are worried about missing them."
                  },
                  {
                        "question": "Do standard data and text messaging rates apply?",
                        "answer": "Yes, standard data and text messaging rates from your mobile provider may apply when you send your photos to us. We recommend that you check with your service provider if you have concerns about potential charges."
                  },
                  {
                        "question": "Who do I contact if I have an issue with the study surveys?",
                        "answer": "For any issues related to receiving signals, reminders, or understanding questions, please contact the research team member assigned to you at the beginning of the study (your contact person)."
                  },
                  {
                        "question": "I have received an error code from Survey Signal at the time of my first text message, what should I do?",
                        "answer": "This issue might be caused by using a VPN on your phone. Please, make sure you have turned off your VPN when receiving text messages. For any issues, contact the research team member assigned to you at the beginning of the study (your contact person)."
                  }
            ]
      }
];

    const faqRoot = document.getElementById("faqRoot");

    const faqCategoryIcons = {
      "Participation & Study Overview": `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>`,
      "Study Participation & Completion": `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="3"></rect><path d="M9 8h6"></path><path d="M9 12h6"></path><path d="M9 16h3"></path></svg>`,
      "Data Privacy & Security": `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l7 3v5.4c0 4.2-2.8 7.4-7 8.6-4.2-1.2-7-4.4-7-8.6V6.5l7-3z"></path><path d="M9.5 12.2l1.7 1.7 3.6-4"></path></svg>`,
      "Technical & Logistical Questions": `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M10 5.5h4"></path><circle cx="12" cy="18" r="0.8" fill="currentColor" stroke="none"></circle></svg>`
    };

    function createFaqItem(item, index, groupIndex) {
      const article = document.createElement("article");
      article.className = "accordion-item";
      if (groupIndex === 0 && index === 0) article.classList.add("open");

      const trigger = document.createElement("button");
      trigger.className = "accordion-trigger";
      trigger.type = "button";
      trigger.setAttribute("aria-expanded", article.classList.contains("open") ? "true" : "false");

      const title = document.createElement("span");
      title.className = "accordion-title";
      title.textContent = item.question;

      const icon = document.createElement("span");
      icon.className = "accordion-icon";
      icon.setAttribute("aria-hidden", "true");

      const panel = document.createElement("div");
      panel.className = "accordion-panel";

      const panelInner = document.createElement("div");
      panelInner.className = "accordion-panel-inner";

      const answer = document.createElement("p");
      answer.textContent = item.answer;

      trigger.append(title, icon);
      panelInner.append(answer);
      panel.append(panelInner);
      article.append(trigger, panel);

      return article;
    }

    function renderFaq() {
      faqGroups.forEach((group, groupIndex) => {
        const category = document.createElement("h3");
        category.className = "faq-category reveal-on-scroll";
        category.innerHTML = `<span class="faq-category-icon">${faqCategoryIcons[group.category] || ""}</span><span>${group.category}</span>`;

        const accordion = document.createElement("div");
        accordion.className = "accordion reveal-on-scroll reveal-delay-1";

        group.items.forEach((item, index) => {
          accordion.appendChild(createFaqItem(item, index, groupIndex));
        });

        faqRoot.append(category, accordion);
      });

      refreshPanelHeights();
    }

    function refreshPanelHeights() {
      document.querySelectorAll(".accordion-item").forEach(item => {
        const panel = item.querySelector(".accordion-panel");
        if (!panel) return;
        if (item.classList.contains("open")) {
          panel.style.maxHeight = panel.scrollHeight + "px";
        } else {
          panel.style.maxHeight = "0px";
        }
      });
    }

    renderFaq();

    const faqSearchInput = document.getElementById("faqSearchInput");
    const faqSearchClear = document.getElementById("faqSearchClear");
    const faqSearchMeta = document.getElementById("faqSearchMeta");

    function removeFaqSearchHighlights() {
      faqRoot.querySelectorAll("mark.search-highlight").forEach(mark => {
        const textNode = document.createTextNode(mark.textContent);
        mark.replaceWith(textNode);
        textNode.parentNode.normalize();
      });
    }

    function setFaqSearchMeta(message) {
      faqSearchMeta.textContent = message || "";
    }

    function updateFaqSearchClearButton() {
      faqSearchClear.classList.toggle("visible", faqSearchInput.value.trim().length > 0);
    }

    function highlightFaqTextNode(textNode, query) {
      const text = textNode.nodeValue;
      const lowerText = text.toLowerCase();
      const lowerQuery = query.toLowerCase();
      const fragment = document.createDocumentFragment();
      let cursor = 0;
      let matchIndex = lowerText.indexOf(lowerQuery, cursor);
      let count = 0;

      while (matchIndex !== -1) {
        if (matchIndex > cursor) {
          fragment.appendChild(document.createTextNode(text.slice(cursor, matchIndex)));
        }

        const mark = document.createElement("mark");
        mark.className = "search-highlight";
        mark.textContent = text.slice(matchIndex, matchIndex + query.length);
        fragment.appendChild(mark);
        count += 1;

        cursor = matchIndex + query.length;
        matchIndex = lowerText.indexOf(lowerQuery, cursor);
      }

      if (cursor < text.length) {
        fragment.appendChild(document.createTextNode(text.slice(cursor)));
      }

      textNode.replaceWith(fragment);
      return count;
    }

    function openAccordionForHighlight(highlight) {
      const item = highlight.closest(".accordion-item");
      if (!item) return;

      item.classList.add("open");
      const trigger = item.querySelector(".accordion-trigger");
      if (trigger) trigger.setAttribute("aria-expanded", "true");
      refreshPanelHeights();
    }

    function runFaqSearch() {
      const query = faqSearchInput.value.trim();
      removeFaqSearchHighlights();

      if (!query) {
        setFaqSearchMeta("");
        refreshPanelHeights();
        updateFaqSearchClearButton();
        return;
      }

      const walker = document.createTreeWalker(
        faqRoot,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode(node) {
            if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            if (node.parentElement && node.parentElement.closest("mark")) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );

      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      textNodes.forEach(node => highlightFaqTextNode(node, query));

      const highlights = Array.from(faqRoot.querySelectorAll("mark.search-highlight"));

      if (!highlights.length) {
        setFaqSearchMeta(`No FAQ matches for “${query}”.`);
        refreshPanelHeights();
        updateFaqSearchClearButton();
        return;
      }

      const firstHighlight = highlights[0];
      firstHighlight.classList.add("first-match");
      openAccordionForHighlight(firstHighlight);
      setFaqSearchMeta(`${highlights.length} FAQ ${highlights.length === 1 ? "match" : "matches"} for “${query}”.`);
      updateFaqSearchClearButton();

      setTimeout(() => {
        firstHighlight.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 120);
    }

    faqSearchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        runFaqSearch();
      }
    });

    faqSearchInput.addEventListener("input", () => {
      updateFaqSearchClearButton();
      if (!faqSearchInput.value.trim()) {
        removeFaqSearchHighlights();
        setFaqSearchMeta("");
        refreshPanelHeights();
      }
    });

    faqSearchClear.addEventListener("click", () => {
      faqSearchInput.value = "";
      removeFaqSearchHighlights();
      setFaqSearchMeta("");
      updateFaqSearchClearButton();
      refreshPanelHeights();
      faqSearchInput.focus();
    });

    function setupRevealAnimations() {
      const loadRevealItems = document.querySelectorAll(".reveal-on-load");
      requestAnimationFrame(() => {
        loadRevealItems.forEach(item => item.classList.add("is-visible"));
      });

      const scrollRevealItems = document.querySelectorAll(".reveal-on-scroll");
      const revealObserver = new IntersectionObserver(
        entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              revealObserver.unobserve(entry.target);
            }
          });
        },
        {
          threshold: 0.16,
          rootMargin: "0px 0px -8% 0px"
        }
      );

      scrollRevealItems.forEach(item => revealObserver.observe(item));
    }

    setupRevealAnimations();

    document.addEventListener("click", event => {
      const trigger = event.target.closest(".accordion-trigger");
      if (!trigger) return;

      const item = trigger.closest(".accordion-item");
      const wasOpen = item.classList.contains("open");

      item.classList.toggle("open", !wasOpen);
      trigger.setAttribute("aria-expanded", String(!wasOpen));
      refreshPanelHeights();
    });

    window.addEventListener("resize", refreshPanelHeights);

    const studyVideo = document.getElementById("studyVideo");
    const watchVideoButton = document.getElementById("watchVideoButton");
    const videoModal = document.getElementById("videoModal");
    const modalClose = document.getElementById("modalClose");
    const videoTranscriptToggle = document.getElementById("videoTranscriptToggle");
    const videoTranscriptPanel = document.getElementById("videoTranscriptPanel");
    const videoTranscript = document.getElementById("videoTranscript");
    const videoTranscriptText = document.getElementById("videoTranscriptText");

    const onboardingTranscriptCues = [
      { start: 0, text: "Hi and welcome to the study of photography experiences." },
      { start: 4, text: "We at the quality of life research center of Claremont Graduate University." },
      { start: 9, text: "Thank you for helping us learn about the creative experience of photography." },
      { start: 13, text: "In this video, we will give you an overview of why we are interested in doing this study, what we expect from" },
      { start: 20, text: "you, as well as what you can expect from us, and finally how you will participate in this study. As we proceed, pause or rewind this video at any time." },
      { start: 32, text: "If anything is unclear, refer to the FAQ on our web page or feel free to call or email your contact person. All right," },
      { start: 40, text: "let's get started. Our aim for this research is to understand the photo taking experience." },
      { start: 46, text: "As digital or smartphone, photography has become more accessible. Photography has become a regular part of daily life." },
      { start: 55, text: "By joining this study, you are helping us understand the different ways people interact with and utilize their mobile cameras to be connected to their" },
      { start: 62, text: "surroundings throughout the day. Your contribution allows us at the Quality of Life Research Center to better understand the role that photography" },
      { start: 70, text: "plays in modern daily life and personal experience. Here is what we expect from you." },
      { start: 77, text: "Because we hope to learn about your daily experience, you will need to use the same phone to complete your daily reports. We will also send reminders via" },
      { start: 85, text: "text throughout the study. So, be sure to turn the volume up on your device." },
      { start: 90, text: "During the week of your study participation, we want you to go about your life as usual. We are interested in your natural everyday experience." },
      { start: 99, text: "Now, what can you expect from us during the study? Your contact person will check in with you briefly just to make sure the technology is working and to answer any questions that may arise." },
      { start: 111, text: "However, please feel free to reach out at any time. You will receive daily reminders and instructions regarding surveys." },
      { start: 119, text: "Your data is important to us and we will protect your confidentiality to the best of our ability. Upon completion of your" },
      { start: 126, text: "end of the study survey, we will give you a $15 Amazon gift card. What will you do during the study? Your time with" },
      { start: 134, text: "us will begin the day you have your phone call with your contact. Once we have guided you through your setup process over the phone, you will begin completing the surveys the very next" },
      { start: 143, text: "day. For example, if you schedule your phone call for Wednesday, then you will start completing surveys at the end of" },
      { start: 150, text: "the day on Thursday. During your scheduled phone call, we can also answer any questions you might have from this video. After the phone call, you will" },
      { start: 159, text: "complete your startup survey. On day one of the study, you will begin your daily end of the day surveys. Let's briefly go into a little more depth on what your" },
      { start: 167, text: "day will be like. You will receive an evening text with a link to complete your daily end of the day surveys. Click on the link to your end of the day" },
      { start: 176, text: "survey. This survey opens with a question with multiple answers that scale from extremely bad to extremely good. Simply tap the choice that best" },
      { start: 184, text: "reflects your answer. Some questions may ask you to type in your answer. Click the text box and enter your response." },
      { start: 193, text: "that covers everything you need to know before you begin. Over the course of the study, you'll receive daily text messages to guide you through each step" },
      { start: 201, text: "and finish each day with an evening reflection." },
      { start: 204, text: "We'll be here to support you along the way. So, if you ever have a question, don't hesitate to reach out to your contact person. After you've completed" },
      { start: 213, text: "the study, we'll send you an end of study survey." },
      { start: 217, text: "Then about one month later, we'll email you one final follow-up survey." },
      { start: 222, text: "On behalf of everyone at the Quality of Life Research Center at Claremont Graduate University, thank you for taking part in this study. We appreciate" },
      { start: 230, text: "your time and participation, and we look forward to learning from your experiences." },
    ];

    let activeTranscriptCueIndex = -1;
    let transcriptCueElements = [];

    function formatTranscriptTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = Math.floor(totalSeconds % 60);
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function seekVideoToTranscriptCue(index) {
      const cue = onboardingTranscriptCues[index];
      if (!cue) return;

      const seekAndPlay = () => {
        try {
          studyVideo.currentTime = cue.start;
          setActiveTranscriptCue(index, { scroll: true, behavior: "smooth", force: true });
          studyVideo.play().catch(() => {
            // Native controls remain available if playback is blocked.
          });
        } catch (error) {
          // Ignore a transient seek error while metadata finishes loading.
        }
      };

      if (studyVideo.readyState >= 1) {
        seekAndPlay();
      } else {
        studyVideo.addEventListener("loadedmetadata", seekAndPlay, { once: true });
        studyVideo.load();
      }
    }

    function renderOnboardingTranscript() {
      videoTranscriptText.replaceChildren();

      transcriptCueElements = onboardingTranscriptCues.map((cue, index) => {
        const cueButton = document.createElement("button");
        cueButton.className = "transcript-cue";
        cueButton.type = "button";
        cueButton.dataset.cueIndex = String(index);
        cueButton.dataset.start = String(cue.start);
        cueButton.textContent = cue.text;
        cueButton.setAttribute("aria-label", `Jump to ${formatTranscriptTime(cue.start)}: ${cue.text}`);
        cueButton.addEventListener("click", () => seekVideoToTranscriptCue(index));
        videoTranscriptText.appendChild(cueButton);
        return cueButton;
      });
    }

    function getTranscriptCueIndex(currentTime) {
      let low = 0;
      let high = onboardingTranscriptCues.length - 1;
      let match = 0;

      while (low <= high) {
        const middle = Math.floor((low + high) / 2);
        if (onboardingTranscriptCues[middle].start <= currentTime + 0.04) {
          match = middle;
          low = middle + 1;
        } else {
          high = middle - 1;
        }
      }

      return match;
    }

    function scrollTranscriptCueIntoView(cueElement, behavior = "smooth") {
      if (!cueElement || videoTranscriptToggle.getAttribute("aria-expanded") !== "true") return;

      const targetTop = cueElement.offsetTop
        - (videoTranscript.clientHeight / 2)
        + (cueElement.offsetHeight / 2);

      videoTranscript.scrollTo({
        top: Math.max(0, targetTop),
        behavior
      });
    }

    function setActiveTranscriptCue(index, { scroll = true, behavior = "smooth", force = false } = {}) {
      if (!force && index === activeTranscriptCueIndex) return;

      transcriptCueElements.forEach((cueElement, cueIndex) => {
        const isActive = cueIndex === index;
        cueElement.classList.toggle("is-active", isActive);
        if (isActive) {
          cueElement.setAttribute("aria-current", "true");
        } else {
          cueElement.removeAttribute("aria-current");
        }
      });

      activeTranscriptCueIndex = index;

      if (scroll) {
        scrollTranscriptCueIntoView(transcriptCueElements[index], behavior);
      }
    }

    function syncTranscriptToVideo({ force = false, behavior = "smooth" } = {}) {
      const cueIndex = getTranscriptCueIndex(studyVideo.currentTime || 0);
      setActiveTranscriptCue(cueIndex, { scroll: true, behavior, force });
    }


    function setTranscriptExpanded(expanded, { scroll = true } = {}) {
      videoTranscriptToggle.setAttribute("aria-expanded", String(expanded));
      videoTranscriptPanel.classList.toggle("is-open", expanded);
      videoTranscriptPanel.setAttribute("aria-hidden", String(!expanded));
      videoTranscriptPanel.inert = !expanded;

      if (expanded && scroll) {
        requestAnimationFrame(() => {
          scrollTranscriptCueIntoView(transcriptCueElements[activeTranscriptCueIndex], "smooth");
        });
      }
    }

    videoTranscriptToggle.addEventListener("click", () => {
      const isExpanded = videoTranscriptToggle.getAttribute("aria-expanded") === "true";
      setTranscriptExpanded(!isExpanded);
    });

    renderOnboardingTranscript();
    setActiveTranscriptCue(0, { scroll: false, behavior: "auto", force: true });
    setTranscriptExpanded(false, { scroll: false });

    studyVideo.addEventListener("timeupdate", () => syncTranscriptToVideo());
    studyVideo.addEventListener("seeking", () => syncTranscriptToVideo({ force: true, behavior: "auto" }));
    studyVideo.addEventListener("seeked", () => syncTranscriptToVideo({ force: true, behavior: "smooth" }));
    studyVideo.addEventListener("loadedmetadata", () => syncTranscriptToVideo({ force: true, behavior: "auto" }));

    function openVideoModal() {
      videoModal.classList.add("open");
      videoModal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");

      try {
        studyVideo.currentTime = 0;
      } catch (error) {
        // The video metadata may not be available yet.
      }
      videoTranscript.scrollTop = 0;
      setTranscriptExpanded(false, { scroll: false });
      setActiveTranscriptCue(0, { scroll: false, behavior: "auto", force: true });
      syncTranscriptToVideo({ force: true, behavior: "auto" });

      studyVideo.play().catch(() => {
        // Native controls remain available if autoplay is blocked.
      });
    }

    function closeVideoModal() {
      videoModal.classList.remove("open");
      videoModal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      studyVideo.pause();

      try {
        studyVideo.currentTime = 0;
      } catch (error) {
        // Ignore reset errors while the video is still loading.
      }
      videoTranscript.scrollTop = 0;
      setTranscriptExpanded(false, { scroll: false });
      setActiveTranscriptCue(0, { scroll: false, behavior: "auto", force: true });
    }

    watchVideoButton.addEventListener("click", event => {
      event.preventDefault();
      openVideoModal();
    });

    modalClose.addEventListener("click", closeVideoModal);

    videoModal.addEventListener("click", event => {
      if (event.target === videoModal) closeVideoModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && videoModal.classList.contains("open")) closeVideoModal();
    });




  </script>
</body>
</html>
